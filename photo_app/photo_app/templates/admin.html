<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trang Quản Lý Admin - WAR</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; padding: 20px; }
        h1 { text-align: center; color: #e50914; }
        .user-block { background: #1e1e1e; padding: 15px; margin-bottom: 20px; border-radius: 8px; }
        .user-name { font-size: 20px; font-weight: bold; margin-bottom: 10px; color: #ffeb3b; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .grid { display: flex; flex-wrap: wrap; gap: 15px; }
        .img-card { background: #2a2a2a; padding: 10px; border-radius: 6px; text-align: center; width: 160px; }
        .img-card img { width: 100%; height: 120px; object-fit: cover; border-radius: 4px; }
        .btn-delete { background: #e50914; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; margin-top: 8px; width: 100%; font-weight: bold; }
        .btn-delete:hover { background: #b80710; }
    </style>
</head>
<body>
    <h1>DANH SÁCH TÀI KHOẢN VÀ ẢNH ĐÃ TẢI LÊN</h1>
    
    {% if users_data %}
        {% for username, images in users_data.items() %}
            <div class="user-block">
                <div class="user-name">👤 Tài khoản: {{ username }} ({{ images|length }} ảnh)</div>
                <div class="grid">
                    {% for img in images %}
                        <div class="img-card">
                            <a href="{{ img.url }}" target="_blank">
                                <img src="{{ img.url }}" alt="User Photo">
                            </a>
                            <form action="/delete" method="POST">
                                <input type="hidden" name="public_id" value="{{ img.public_id }}">
                                <button type="submit" class="btn-delete" onclick="return confirm('Bạn có chắc muốn xóa ảnh này?')">Xóa Ảnh</button>
                            </form>
                        </div>
                    {% endfor %}
                </div>
            </div>
        {% endfor %}
    {% else %}
        <p style="text-align: center; color: #888;">Chưa có dữ liệu nào được tải lên.</p>
    {% endif %}
</body>
</html>
