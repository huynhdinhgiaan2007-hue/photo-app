<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Ảnh Đã Tải Lên</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f8f9fa; }
        .user-section { background: white; padding: 15px; border-radius: 6px; margin-bottom: 25px; box-shadow: 0 1px 5px rgba(0,0,0,0.1); }
        .user-title { font-size: 20px; color: #333; border-bottom: 2px solid #007bff; padding-bottom: 5px; margin-bottom: 15px; }
        .gallery { display: flex; flex-wrap: wrap; gap: 15px; }
        .img-card { border: 1px solid #ddd; padding: 5px; border-radius: 4px; background: #fff; }
        .img-card img { width: 180px; height: 180px; object-fit: cover; border-radius: 4px; display: block; }
        .img-name { font-size: 12px; color: #666; margin-top: 5px; text-align: center; width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    </style>
</head>
<body>
    <h1>Trang Quản Lý Ảnh (Chủ Web)</h1>
    {% if not users_data %}
        <p>Chưa có ảnh nào được tải lên.</p>
    {% endif %}

    {% for username, files in users_data.items() %}
        <div class="user-section">
            <div class="user-title">Người đăng: <strong>{{ username }}</strong> ({{ files|length }} ảnh)</div>
            <div class="gallery">
                {% for file in files %}
                    <div class="img-card">
                        <img src="{{ url_for('send_image', username=username, filename=file) }}" alt="{{ file }}">
                        <div class="img-name">{{ file }}</div>
                    </div>
                {% endfor %}
            </div>
        </div>
    {% endfor %}
</body>
</html>
